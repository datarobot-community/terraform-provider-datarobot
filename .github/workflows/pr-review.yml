name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check new/modified resources have tests
        run: |
          new_resources=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "pkg/provider/.*_resource\.go$" | grep -v "_test\.go" || true)

          missing=0
          for resource in $new_resources; do
            test_file="${resource%%.go}_test.go"
            if [ ! -f "$test_file" ]; then
              echo "::error file=$resource::Missing test file $test_file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more modified resources are missing tests." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All modified resources have tests." >> "$GITHUB_STEP_SUMMARY"
