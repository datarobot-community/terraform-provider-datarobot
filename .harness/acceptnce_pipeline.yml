pipeline:
  name: terraform-provider-datarobot-pr
  identifier: terraformproviderdatarobotpr
  projectIdentifier: Declarative_API
  orgIdentifier: DSX
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Sample
        repoName: terraform-provider-datarobot
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Tests
        identifier: Tests
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.cigeneral
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run Selective Tests
                  identifier: Run_1
                  spec:
                    connectorRef: account.dockerhub_datarobot_read
                    image: <+input>.default(datarobotdev/platform-base-golang-devel)
                    shell: Sh
                    command: |-
                      microdnf install unzip git
                      TERRAFORM_VERSION="1.14.5"
                      curl -o terraform.zip -SL https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                      unzip terraform.zip
                      mv terraform /usr/local/bin
                      export PATH=$(go env GOPATH)/bin:$PATH
                      go install github.com/jstemmer/go-junit-report/v2@latest
                      go mod download
                      go build -v .
                      set +e
                      NEEDS_FULL_SUITE_FILE=/tmp/needs_full_suite BASE_REF=main TEST_PARALLEL=6 bash scripts/run-changed-tests.sh
                      TEST_EXIT_CODE=$?
                      cat /tmp/needs_full_suite
                      export NEEDS_FULL_SUITE="$(cat /tmp/needs_full_suite 2>/dev/null || echo false)"
                      echo "NEEDS_FULL_SUITE=$NEEDS_FULL_SUITE"
                      trap 'exit $TEST_EXIT_CODE' EXIT
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - /harness/report.xml
                    envVariables:
                      DATAROBOT_ENDPOINT: <+pipeline.variables.endpoint>
                      DATAROBOT_API_TOKEN: <+pipeline.variables.apiKey>
                      DATAROBOT_USERNAME: declarative_user_admin@datarobot.com
                      DATAROBOT_USER_ID: 69987d0c27ee4c2c40d1b924
                    outputVariables:
                      - name: NEEDS_FULL_SUITE
                        type: String
                        value: NEEDS_FULL_SUITE
                    resources:
                      limits:
                        memory: 4Gi
                        cpu: "6"
              - step:
                  name: Notify dsx-alerts
                  identifier: Notify_dsxalerts
                  template:
                    templateRef: org.Send_Slack_notification
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          SLACK_CHANNEL: dsx-alerts
                          SLACK_URL: <+input>.default("")
                          MESSAGE_TYPE: Error
                          MESSAGE_TITLE: Declarative API Terraform Tests Failed
                          MESSAGE_TEXT: "@here Check the pipeline logs to see more details..."
                          MESSAGE_DETAILS_FILENAME: <+input>.default(./SLACK_MESSAGE.md)
                  when:
                    stageStatus: Failure
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
    - stage:
        name: Full suite
        identifier: Full_suite
        description: Runs the shared terraformproviderdatarobotfull pipeline against this PR's own commit (not main) when NEEDS_FULL_SUITE=true.
        type: Pipeline
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.Tests.spec.execution.steps.Run_1.output.outputVariables.NEEDS_FULL_SUITE> == "true"
        spec:
          org: DSX
          project: Declarative_API
          pipeline: terraformproviderdatarobotfull
          inputs:
            identifier: terraformproviderdatarobotfull
            properties:
              ci:
                codebase:
                  build:
                    type: branch
                    spec:
                      branch: <+trigger.targetBranch>
            stages:
              - parallel:
                  - stage:
                      identifier: TestsFast
                      type: CI
                      spec:
                        execution:
                          steps:
                            - step:
                                identifier: RunFast
                                type: Run
                                spec:
                                  image: <+input>.default(datarobotdev/platform-base-golang-devel)
                            - step:
                                identifier: Notify_dsxalerts_fast
                                template:
                                  templateInputs:
                                    type: Run
                                    spec:
                                      envVariables:
                                        SLACK_URL: <+input>.default("")
                                        MESSAGE_DETAILS_FILENAME: <+input>.default(./SLACK_MESSAGE.md)
                  - stage:
                      identifier: TestsModels
                      type: CI
                      spec:
                        execution:
                          steps:
                            - step:
                                identifier: RunModels
                                type: Run
                                spec:
                                  image: <+input>.default(datarobotdev/platform-base-golang-devel)
                            - step:
                                identifier: Notify_dsxalerts_models
                                template:
                                  templateInputs:
                                    type: Run
                                    spec:
                                      envVariables:
                                        SLACK_URL: <+input>.default("")
                                        MESSAGE_DETAILS_FILENAME: <+input>.default(./SLACK_MESSAGE.md)
                  - stage:
                      identifier: TestsDeployments
                      type: CI
                      spec:
                        execution:
                          steps:
                            - step:
                                identifier: RunDeployments
                                type: Run
                                spec:
                                  image: <+input>.default(datarobotdev/platform-base-golang-devel)
                            - step:
                                identifier: Notify_dsxalerts_deployments
                                template:
                                  templateInputs:
                                    type: Run
                                    spec:
                                      envVariables:
                                        SLACK_URL: <+input>.default("")
                                        MESSAGE_DETAILS_FILENAME: <+input>.default(./SLACK_MESSAGE.md)
                  - stage:
                      identifier: TestsApps
                      type: CI
                      spec:
                        execution:
                          steps:
                            - step:
                                identifier: RunApps
                                type: Run
                                spec:
                                  image: <+input>.default(datarobotdev/platform-base-golang-devel)
                            - step:
                                identifier: Notify_dsxalerts_apps
                                template:
                                  templateInputs:
                                    type: Run
                                    spec:
                                      envVariables:
                                        SLACK_URL: <+input>.default("")
                                        MESSAGE_DETAILS_FILENAME: <+input>.default(./SLACK_MESSAGE.md)
            variables:
              - name: endpoint
                type: String
                value: <+input>.default(https://staging.datarobot.com/api/v2).allowedValues(https://staging.datarobot.com/api/v2,https://app.datarobot.com/api/v2,https://dr-app-charts-r10p2-daily-eks.rd.int.datarobot.com/api/v2,https://private-ca-testing.rd.int.datarobot.com/api/v2)
              - name: apiKey
                type: Secret
                default: dr_staging_api_key
                value: <+input>.default(dr_staging_api_key).allowedValues(dr_staging_api_key,dr_app_charts_r10p2_api_key,dr_private_ca_api_key)
  variables:
    - name: endpoint
      type: String
      description: ""
      required: false
      value: <+input>.default(https://staging.datarobot.com/api/v2).allowedValues(https://staging.datarobot.com/api/v2,https://app.datarobot.com/api/v2,https://dr-app-charts-r10p2-daily-eks.rd.int.datarobot.com/api/v2,https://private-ca-testing.rd.int.datarobot.com/api/v2)
    - name: apiKey
      type: Secret
      default: dr_staging_api_key
      description: ""
      required: false
      value: <+input>.default(dr_staging_api_key).allowedValues(dr_staging_api_key,dr_app_charts_r10p2_api_key,dr_private_ca_api_key)
